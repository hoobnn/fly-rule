name: Build rules

on:
  schedule:
    - cron: "30 20 * * *"   # 每日 UTC 20:30 = 北京时间 04:30
  push:
    branches: [main]
    # custom/ 与 custom.py 由 custom.yml 单独处理，不必为它们重建全部上游。
    paths-ignore:
      - "**/*.md"
      - "custom/**"
      - "scripts/custom.py"
      - "scripts/mrs.py"
      - ".github/workflows/custom.yml"
  workflow_dispatch:

# 与 custom.yml 共用一组：两者都推 release，并发会互相覆盖。
# 这里不能 cancel-in-progress —— 取消正在发布的那个会让 release 半更新。
concurrency:
  group: release-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    # 钉死版本而非 ubuntu-latest：构建环境可复现，不会因 runner 镜像
    # 自动升级而在某天突然变化。需要升级时显式改这里。
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      # tomllib 需要 3.11+，脚本无第三方依赖，不需要 pip install
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # ruff-action 自 v4 起是 immutable release，只发精确版本，
      # 没有 v4 这样的浮动大版本标签，升级时需要手动改这里。
      - name: Lint Python (ruff)
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: check --output-format=github

      - name: Check Python formatting (ruff)
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: format --check

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint Markdown
        run: pnpm exec markdownlint-cli2

      # mrs 是 mihomo 自己的预编译二进制格式，只能由 mihomo convert-ruleset
      # 生成，没有纯 Python 实现。版本钉死，好让产物可复现；升级时改这里。
      - name: Install mihomo (for mrs)
        env:
          MIHOMO_VERSION: v1.19.31
          # 校验和与版本一起钉死：mrs 是二进制产物，二进制被动过或下载损坏时
          # 编译出的 mrs 也是坏的，而坏 mrs 要到客户端加载才会暴露。
          MIHOMO_SHA256: d5e74bbddbdfff49a1aef7775bf5911da59f0d7196ed509a0ac914b3653dd5f1
        run: |
          set -euo pipefail
          url="https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-linux-amd64-${MIHOMO_VERSION}.gz"
          curl -fsSL "$url" -o /tmp/mihomo.gz
          echo "${MIHOMO_SHA256}  /tmp/mihomo.gz" | sha256sum -c -
          gunzip -f /tmp/mihomo.gz
          install -m 0755 /tmp/mihomo /usr/local/bin/mihomo
          mihomo -v | head -1

      - name: Build
        run: python scripts/build.py

      # build.py 内部也会重建 custom/，所以这里同样要编译 mrs。
      - name: Compile mrs
        run: python scripts/mrs.py --require

      - name: Verify output
        run: python scripts/verify.py --require-mrs

      # 我们忠实同步上游，上游出问题会直接传导到产物。
      # 与上次发布比对，异常缩水就拦下，不让坏数据进 release。
      - name: Guard against upstream regression
        run: python scripts/guard.py --repo "${{ github.repository }}"

      # release 是孤儿分支，只存产物，每次发布都是一个新的根提交，
      # 不与 main 共享历史、也不累积历史（同 MetaCubeX 的 meta、
      # Loyalsoldier 的 release 分支做法）。
      - name: Publish to release branch
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 多上游：提交信息里带上每个上游的 commit
          revs=$(python scripts/revs.py dist/build-report.json)

          # 把产物挪到仓库外，避免 clean 时被一并删除
          staging=$(mktemp -d)
          cp -R dist/. "$staging/"

          git checkout --orphan release-tmp
          git reset --hard          # 清空索引与工作区（已跟踪文件）
          # .work 里是上游的完整克隆，本身是 git 仓库。git clean 不加 -ff
          # 不会删嵌套仓库，残留下来会被 git add 成 gitlink（模式 160000），
          # 让 release 带上三个无法解析的子模块。这里先显式删掉。
          rm -rf .work
          git clean -fdx -e .git    # 清掉其余未跟踪文件与忽略项

          cp -R "$staging/." .
          rm -rf "$staging"

          git add -A

          # 兜底：产物里不该有任何 gitlink（嵌套仓库残留）
          if git ls-files -s | grep -q '^160000'; then
            echo "产物含 gitlink，拒绝发布:" >&2
            git ls-files -s | grep '^160000' >&2
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "内容无变化，跳过发布"
            exit 0
          fi
          git commit -q -m "build: ${revs} ($(date -u +%Y-%m-%dT%H:%MZ))"
          git branch -M release-tmp release
          git push -f origin release
